server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 22g;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_request_buffering off;
  }

  location /media/ {
    proxy_pass http://api:3001;
  }

  location /docs {
    proxy_pass http://api:3001;
    proxy_set_header X-Correlation-Id $request_id;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
